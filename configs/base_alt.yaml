data:
  dataset_name: "ALT"
  src_lang: "en"
  tgt_lang: "vi"
  vocab_size: 10000

model:
  model_type: "base"       # Đổi thành "re" để dùng ReTransformer
  d_model: 512
  nhead: 4
  num_layers: 4
  dim_feedforward: 1024
  dropout: 0.2

train:
  batch_size: 64
  lr: 0.0005
  epochs: 30
  gpu_mode: true
  use_amp: true      # Mixed Precision
  save_dir: "outputs/checkpoints/base_alt_en_vi"
  use_wandb: true

logging:
  use_wandb: true
  project_name: "base_alt_en_vi"
  wandb_api_key: "my_key"